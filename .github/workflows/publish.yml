name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents: 只读代码
    # id-token: npm trusted publishing（OIDC）——所以本仓库不再需要 NPM_TOKEN 密钥
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # 刻意不用 setup-node 的 registry-url：它会写一份引用 ${NODE_AUTH_TOKEN} 的
      # .npmrc，和 OIDC 认证打架。registry 用 npm 默认值即可。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # trusted publishing 需要 npm >= 11.5.1，不依赖 runner 自带的那一版。
      - name: 确保 npm 支持 trusted publishing
        run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build
      # OIDC：npm CLI 自动用 GitHub Actions 的短时身份换发布凭据，无需任何长期 token。
      - run: npm publish --access public --registry=https://registry.npmjs.org/

description: 单步对抗验证循环：实现与验证在同一环节内迭代，直到通过

adversarial_check:
  # model: anthropic/claude-sonnet-4-5  # 可选：验证模型（"provider/model" 或 {providerID, modelID}）；不填则用 ralph-check agent 默认模型
  timeout_ms: 3600000  # 60 分钟（上限）

steps:
  - id: loop
    desc: 迭代执行任务直到通过对抗验证
    reset: true
    do: |
      完成用户任务。产出要经得起独立验证——用项目现有的验证手段
      （测试、lint/typecheck、构建、运行结果）自验。

      本轮结束前输出**执行摘要**：
      - 完成事项（对照任务）
      - 变更文件（git 项目用 git status / git diff --stat；非 git 项目直接列出）
      - 运行过的验证命令及真实结果
      - 未完成部分与下一步打算
    input: 用户任务描述
    output: 实现的代码/文件 + 执行摘要（含验证证据）
    check: |
      独立验证，不信任 DO 的报告：

      1. 对照用户任务列出完成标准，逐条独立核实（运行命令、读代码），
         不以摘要声称作依据
      2. 核对变更范围与摘要一致；重跑关键验证命令，看真实输出
      3. 审视变更找破绽：边界条件、错误处理、状态泄漏、前后不兼容、需求遗漏
      4. 不通过时说明具体失败项和触发场景
    on_pass: done
    on_fail: loop
    max_fail_count: 100
